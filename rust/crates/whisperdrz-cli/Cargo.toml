[package]
name = "whisperdrz-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transcribe and bench CLI for the native whisperdrz runtime"

[[bin]]
name = "whisperdrz-native"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["whisperdrz-native/cuda"]

[dependencies]
whisperdrz-native = { path = "../whisperdrz-native" }
color-eyre.workspace = true
eyre.workspace = true
serde_json.workspace = true
