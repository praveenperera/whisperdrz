[package]
name = "whisperdrz-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust runtime for whisperdrz: mel, encoder, constrained decoding, DTW word timing and ECAPA2 speaker linking"

[features]
default = []
# GPU runtime: cudarc driver API, embedded cuda-oxide PTX, cuBLAS/cuBLASLt loaded at run time
cuda = ["dep:cudarc", "dep:libloading"]

[dependencies]
eyre.workspace = true
half.workspace = true
bytemuck.workspace = true
safetensors.workspace = true
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true
fancy-regex.workspace = true
regex.workspace = true
base64.workspace = true
unicode_names2.workspace = true
unicode-general-category.workspace = true
realfft.workspace = true
rayon.workspace = true
cudarc = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
whisperdrz-fixtures = { path = "../whisperdrz-fixtures" }
# exact f64 parsing, so expected floats from the Python compare bit for bit
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
